<!doctype html><html lang="pl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Giełda"><meta name="theme-color" content="#f6f7f4">
<link rel="manifest" href="./manifest.webmanifest"><title>Giełda • Zakupy</title>
<style>
:root{--g:#087a42;--gl:#eaf6ee;--bg:#f6f7f4;--card:#fff;--ink:#111713;--mut:#6e756f;--line:#e1e5e1;--red:#d84a45;--blue:#3679bd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;color:var(--ink)}
button,input,select,textarea{font:inherit}.app{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 14px calc(90px + env(safe-area-inset-bottom));min-height:100vh}
header{height:58px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:18px}.brand span{font-size:23px;margin-right:8px}.gear{border:0;background:#fff;border-radius:50%;width:38px;height:38px}
.screen{display:none}.screen.active{display:block}.datebar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px}.datebar input{flex:1;border:0;text-align:center;background:transparent;font-weight:700}.arr{border:0;background:#f2f4f1;border-radius:8px;padding:7px 11px}
.tabs,.chips{display:flex;gap:7px;overflow:auto;margin:10px 0}.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;white-space:nowrap;font-size:12px}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.search{width:100%;padding:11px 13px;border:1px solid var(--line);background:#fff;border-radius:11px;margin:5px 0 8px}
.item,.panel,.rowcard{background:#fff;border:1px solid var(--line);border-radius:13px;margin:7px 0}.item{padding:11px}.itop{display:flex;align-items:center;gap:10px}.emoji{width:42px;height:42px;background:#f2f5ef;border-radius:11px;display:grid;place-items:center;font-size:26px}.grow{flex:1}.name{font-weight:750}.meta{font-size:11px;color:var(--mut);margin-top:2px}.price{font-weight:800;color:var(--g);font-size:13px;text-align:right}.circle{width:24px;height:24px;border:2px solid #cdd4ce;border-radius:50%;display:grid;place-items:center}.circle.done{background:var(--g);border-color:var(--g);color:#fff}.status{font-size:10px;border-radius:7px;padding:5px 7px;background:#e9f2fb;color:var(--blue)}.status.no{background:#fdebea;color:var(--red)}
.bottomsum{position:sticky;bottom:78px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px;margin-top:10px}.sumgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;font-size:10px}.sumgrid b{display:block;font-size:15px}.add{width:100%;margin-top:9px;border:0;background:var(--g);color:#fff;border-radius:10px;padding:12px;font-weight:800}
.title{display:flex;justify-content:space-between;align-items:center;margin:8px 2px}.title h2{font-size:20px}.plus{border:0;background:var(--g);color:#fff;border-radius:50%;width:38px;height:38px;font-size:24px}.calendar{padding:12px}.calhead{text-align:center;font-weight:800;margin-bottom:10px}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:5px;font-size:12px}.calgrid span{padding:7px 2px}.calgrid .sel{background:var(--g);color:#fff;border-radius:50%}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.kpi{background:#f5f7f4;border-radius:10px;padding:9px;text-align:center}.kpi b{display:block;font-size:17px;color:var(--g)}.rowcard{padding:11px;display:flex;justify-content:space-between;align-items:center}
.catbar{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:8px 0}.catbtn{border:0;background:#fff;border-radius:10px;padding:8px 2px;font-size:10px}.catbtn b{display:block;font-size:18px}.catbtn.on{background:var(--g);color:#fff}
.star{border:0;background:transparent;font-size:21px;color:#e9a800}.edit{border:0;background:#f1f3f0;border-radius:8px;padding:7px}
.chart{height:190px;padding:14px 8px 5px}.chart svg{width:100%;height:100%}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{background:#eef7f0;border-radius:9px;padding:8px;text-align:center;font-size:9px}.stat b{display:block;color:var(--g);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}.navin{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav{border:0;background:transparent;font-size:10px;color:var(--mut);padding:6px 2px}.nav b{display:block;font-size:19px}.nav.on{color:var(--g)}
.modalw{display:none;position:fixed;inset:0;background:#0006;z-index:40;align-items:flex-end;justify-content:center}.modalw.open{display:flex}.modal{width:min(720px,100%);max-height:91vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 15px calc(18px + env(safe-area-inset-bottom))}.modal h2{margin:0 0 12px}.modal label{font-size:11px;color:var(--mut);display:block;margin:9px 2px 4px}.modal input,.modal select,.modal textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:7px}.calc{background:#e8f6ed;color:var(--g);font-size:20px;font-weight:850;text-align:center;border-radius:11px;padding:12px;margin:10px 0}.foot{display:flex;gap:7px;margin-top:12px}.foot button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);font-weight:700}.save{background:var(--g);color:#fff;border-color:var(--g)!important}.danger{color:var(--red);background:#fff}.empty{text-align:center;color:var(--mut);padding:35px}
</style></head><body><div class="app"><header><div class="brand"><span>🧺</span>Giełda • Zakupy</div><button class="gear" onclick="go('settings')">⚙</button></header>

<section id="today" class="screen active"><div class="datebar"><button class="arr" onclick="shiftDate(-1)">‹</button><input id="date" type="date"><button class="arr" onclick="shiftDate(1)">›</button></div><div class="tabs" id="statusTabs"></div><input class="search" id="todaySearch" placeholder="⌕  Szukaj produktu..." oninput="renderToday()"><div id="todayItems"></div><div class="bottomsum"><div id="sum" class="sumgrid"></div><button class="add" onclick="openAdd()">＋ Dodaj produkt</button></div></section>

<section id="lists" class="screen"><div class="title"><h2>Listy zakupów</h2><button class="plus" onclick="go('today')">+</button></div><div class="panel calendar"><div class="calhead" id="monthTitle"></div><div class="calgrid" id="calendar"></div></div><div id="selectedListInfo"></div><h3>Ostatnie listy</h3><div id="listHistory"></div></section>

<section id="products" class="screen"><div class="title"><h2>Produkty</h2><button class="plus" onclick="openProduct()">+</button></div><input class="search" id="productSearch" placeholder="⌕  Szukaj produktu..." oninput="renderProducts()"><div class="catbar" id="catBar"></div><div id="productList"></div></section>

<section id="history" class="screen"><div class="title"><h2>Historia i analizy</h2></div><select class="search" id="histProduct" onchange="renderHistory()"></select><div class="tabs"><button class="chip on">Ceny</button><button class="chip">Zakupy</button><button class="chip">Statystyki</button></div><div class="panel chart" id="chart"></div><div class="statgrid" id="stats"></div><h3>Ostatnie zakupy</h3><div id="historyRows"></div></section>

<section id="settings" class="screen"><div class="title"><h2>Dane i ustawienia</h2></div><div class="panel" style="padding:12px"><b>Kopia bezpieczeństwa</b><p class="meta">Listy i ceny są przechowywane lokalnie na tym urządzeniu.</p><div class="foot"><button onclick="exportData()">Eksport JSON</button><button onclick="importFile.click()">Import JSON</button></div><input id="importFile" type="file" accept=".json" hidden onchange="importData(this)"></div><div class="panel" style="padding:12px"><b>Kategorie</b><div id="settingsCats"></div><div class="twocol"><input id="newCat" placeholder="Nowa kategoria"><button class="save" style="border:0;border-radius:10px" onclick="addCat()">Dodaj</button></div></div></section>
</div>

<nav><div class="navin"><button class="nav on" data-s="today"><b>▣</b>Dzisiaj</button><button class="nav" data-s="lists"><b>▤</b>Listy</button><button class="nav" data-s="products"><b>◇</b>Produkty</button><button class="nav" data-s="history"><b>◷</b>Historia</button><button class="nav" data-s="settings"><b>•••</b>Więcej</button></div></nav>

<div id="buyModal" class="modalw"><div class="modal"><h2 id="buyTitle"></h2><div class="meta" id="buyMeta"></div><div class="tabs"><button class="chip" onclick="setState('todo')">Do kupienia</button><button class="chip on" onclick="setState('bought')">✓ Kupione</button><button class="chip" onclick="setState('missed')">Nie kupiono</button></div><div class="twocol"><div><label>Ilość / waga</label><input id="bQty" type="number" inputmode="decimal" step=".01" oninput="calcBuy()"></div><div><label>Kwota za całość</label><input id="bTotal" type="number" inputmode="decimal" step=".01" oninput="calcBuy()"></div></div><div class="calc" id="bCalc">—</div><label>Dostawca / stoisko</label><input id="bVendor"><label>Notatka</label><textarea id="bNote" rows="3"></textarea><div id="lastPrice" class="meta" style="margin-top:10px"></div><div class="foot"><button class="danger" onclick="removeCurrent()">Usuń</button><button class="save" onclick="saveBuy()">✓ Zapisz</button></div></div></div>

<div id="addModal" class="modalw"><div class="modal"><h2>Dodaj do listy</h2><input class="search" id="addSearch" placeholder="Szukaj..." oninput="renderAdd()"><div id="addList"></div><div class="foot"><button onclick="closeM('addModal')">Zamknij</button></div></div></div>

<div id="productModal" class="modalw"><div class="modal"><h2 id="prodModalTitle">Produkt</h2><label>Nazwa</label><input id="pName"><div class="twocol"><div><label>Kategoria</label><select id="pCat"></select></div><div><label>Jednostka</label><select id="pUnit"><option>kg</option><option>szt.</option><option>op.</option><option>skrzynka</option><option>pęczek</option><option>karton</option></select></div></div><div class="twocol"><div><label>Domyślna ilość</label><input id="pQty" type="number" step=".01"></div><div><label>Domyślne stoisko</label><input id="pVendor"></div></div><label><input id="pFav" type="checkbox" style="width:auto"> Ulubiony</label><div class="foot"><button onclick="closeM('productModal')">Anuluj</button><button class="save" onclick="saveProduct()">Zapisz</button></div></div></div>

<script>
const KEY='gieldaV4';const icons={'Warzywa':'🥬','Owoce':'🍎','Zioła':'🌿','Nabiał':'🥛','Pozostałe':'📦'};
const seed={categories:['Warzywa','Owoce','Zioła','Nabiał','Pozostałe'],products:[
{id:'p1',name:'Pomidor malinowy',cat:'Warzywa',unit:'kg',emoji:'🍅',fav:true,qty:10,vendor:''},{id:'p2',name:'Ogórek',cat:'Warzywa',unit:'kg',emoji:'🥒',fav:true,qty:5,vendor:''},{id:'p3',name:'Papryka czerwona',cat:'Warzywa',unit:'kg',emoji:'🫑',fav:false,qty:8,vendor:''},{id:'p4',name:'Sałata lodowa',cat:'Warzywa',unit:'szt.',emoji:'🥬',fav:true,qty:12,vendor:''},{id:'p5',name:'Banan',cat:'Owoce',unit:'kg',emoji:'🍌',fav:true,qty:15,vendor:''},{id:'p6',name:'Marchew',cat:'Warzywa',unit:'kg',emoji:'🥕',fav:false,qty:10,vendor:''},{id:'p7',name:'Ziemniaki',cat:'Warzywa',unit:'kg',emoji:'🥔',fav:false,qty:20,vendor:''},{id:'p8',name:'Cebula',cat:'Warzywa',unit:'kg',emoji:'🧅',fav:false,qty:10,vendor:''},{id:'p9',name:'Jabłko',cat:'Owoce',unit:'kg',emoji:'🍎',fav:false,qty:10,vendor:''}],lists:{}};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed, filter='all',catFilter='all',current=null,buyState='bought',editPid=null;
const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),money=n=>(+n||0).toLocaleString('pl-PL',{style:'currency',currency:'PLN'}),prod=id=>db.products.find(p=>p.id===id),list=()=>db.lists[$('date').value]||(db.lists[$('date').value]=[]);
$('date').value=new Date().toLocaleDateString('en-CA');$('date').onchange=renderAll;
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.s));
function go(s){document.querySelectorAll('.screen,.nav').forEach(x=>x.classList.remove('active','on'));$(s).classList.add('active');document.querySelector(`[data-s="${s}"]`).classList.add('on');renderAll()}
function shiftDate(n){let d=new Date($('date').value+'T12:00');d.setDate(d.getDate()+n);$('date').value=d.toLocaleDateString('en-CA');renderAll()}
function prev(pid,before=$('date').value){let a=[];Object.entries(db.lists).forEach(([d,l])=>d<before&&l.forEach(x=>{if(x.pid===pid&&x.state==='bought'&&+x.qty&&+x.total)a.push({d,r:+x.total/+x.qty})}));return a.sort((a,b)=>b.d.localeCompare(a.d))[0]}
function renderToday(){let l=list(),q=$('todaySearch').value.toLowerCase(),counts={all:l.length,todo:l.filter(x=>x.state==='todo').length,bought:l.filter(x=>x.state==='bought').length,missed:l.filter(x=>x.state==='missed').length};$('statusTabs').innerHTML=[['all','Wszystkie'],['todo','Do kupienia'],['bought','Kupione'],['missed','Nie kupiono']].map(([k,v])=>`<button class="chip ${filter===k?'on':''}" onclick="filter='${k}';renderToday()">${v} ${counts[k]}</button>`).join('');
let arr=l.filter(x=>(filter==='all'||x.state===filter)&&prod(x.pid).name.toLowerCase().includes(q));$('todayItems').innerHTML=arr.map(x=>{let p=prod(x.pid),r=(+x.qty&&+x.total)?+x.total/+x.qty:0;return `<div class=item onclick="openBuy('${x.id}')"><div class=itop><div class=emoji>${p.emoji||icons[p.cat]||'📦'}</div><div class=grow><div class=name>${p.name}</div><div class=meta>${x.plan||p.qty||'—'} ${p.unit}${x.vendor?' • '+x.vendor:''}</div></div><div>${r?`<div class=price>${money(r)}/${p.unit}</div>`:''}${x.state==='missed'?'<span class="status no">Nie kupiono</span>':x.state==='todo'?'<span class=status>Do kupienia</span>':''}</div><div class="circle ${x.state==='bought'?'done':''}">${x.state==='bought'?'✓':''}</div></div></div>`}).join('')||'<div class=empty>Brak pozycji.</div>';
let b=l.filter(x=>x.state==='bought'),m=l.filter(x=>x.state==='missed'),sum=b.reduce((s,x)=>s+(+x.total||0),0);$('sum').innerHTML=`<div><b>${b.length}</b>Kupione</div><div><b>${l.length-b.length-m.length}</b>Do kupienia</div><div style="color:var(--red)"><b>${m.length}</b>Nie kupiono</div><div><b>${money(sum)}</b>Razem</div>`}
function openAdd(){$('addSearch').value='';renderAdd();openM('addModal')}function renderAdd(){let ids=new Set(list().map(x=>x.pid)),q=$('addSearch').value.toLowerCase();$('addList').innerHTML=db.products.filter(p=>!ids.has(p.id)&&p.name.toLowerCase().includes(q)).map(p=>`<div class=rowcard onclick="addOne('${p.id}')"><div><b>${p.emoji||'📦'} ${p.name}</b><div class=meta>${p.cat} • ${p.qty||'—'} ${p.unit}</div></div><b style="color:var(--g)">＋</b></div>`).join('')||'<div class=empty>Brak produktów do dodania.</div>'}
function addOne(pid){let p=prod(pid);list().push({id:'i'+Date.now()+Math.random(),pid,state:'todo',plan:p.qty||'',qty:'',total:'',vendor:p.vendor||'',note:''});save();renderAdd();renderToday()}
function openBuy(id){current=id;let x=list().find(a=>a.id===id),p=prod(x.pid);buyState=x.state||'bought';$('buyTitle').textContent=p.name;$('buyMeta').textContent=`Kategoria: ${p.cat} • jednostka: ${p.unit}`;$('bQty').value=x.qty||x.plan||p.qty||'';$('bTotal').value=x.total||'';$('bVendor').value=x.vendor||p.vendor||'';$('bNote').value=x.note||'';let pr=prev(p.id);$('lastPrice').textContent=pr?`Ostatnia cena: ${money(pr.r)}/${p.unit} (${pr.d})`:'';calcBuy();openM('buyModal')}
function setState(s){buyState=s}function calcBuy(){let x=list().find(a=>a.id===current),p=x&&prod(x.pid),r=+$('bQty').value&&+$('bTotal').value?+$('bTotal').value/+$('bQty').value:0;$('bCalc').textContent=r?`${money(r)}/${p.unit}`:'Wpisz ilość i kwotę'}
function saveBuy(){let x=list().find(a=>a.id===current);Object.assign(x,{state:buyState,qty:$('bQty').value,total:$('bTotal').value,vendor:$('bVendor').value,note:$('bNote').value});save();closeM('buyModal');renderAll()}function removeCurrent(){db.lists[$('date').value]=list().filter(a=>a.id!==current);save();closeM('buyModal');renderAll()}
function renderLists(){let d=new Date($('date').value+'T12:00'),y=d.getFullYear(),m=d.getMonth();$('monthTitle').textContent=d.toLocaleDateString('pl-PL',{month:'long',year:'numeric'});let first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),off=(first.getDay()+6)%7,out=['Pn','Wt','Śr','Cz','Pt','So','Nd'].map(x=>`<b>${x}</b>`).join('');for(let i=0;i<off;i++)out+='<span></span>';for(let day=1;day<=days;day++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;out+=`<span class="${ds===$('date').value?'sel':''}" onclick="$('date').value='${ds}';renderAll()">${day}</span>`}$('calendar').innerHTML=out;let l=list(),b=l.filter(x=>x.state==='bought');$('selectedListInfo').innerHTML=`<div class=panel style="padding:12px"><b>Lista na ${$('date').value}</b><div class=kpis><div class=kpi><b>${l.length}</b>Pozycji</div><div class=kpi><b>${b.length}</b>Kupione</div><div class=kpi><b>${l.filter(x=>x.state==='todo').length}</b>Do kupienia</div><div class=kpi><b>${l.filter(x=>x.state==='missed').length}</b>Brak</div></div></div>`;let ds=Object.keys(db.lists).filter(x=>db.lists[x].length).sort().reverse();$('listHistory').innerHTML=ds.map(x=>`<div class=rowcard onclick="$('date').value='${x}';go('today')"><div><b>${x}</b><div class=meta>${db.lists[x].length} pozycji</div></div><b>${money(db.lists[x].filter(a=>a.state==='bought').reduce((s,a)=>s+(+a.total||0),0))}</b></div>`).join('')}
function renderProducts(){let q=$('productSearch').value.toLowerCase();$('catBar').innerHTML=[['all','▦','Wszystkie'],...db.categories.map(c=>[c,icons[c]||'□',c])].map(([k,i,n])=>`<button class="catbtn ${catFilter===k?'on':''}" onclick="catFilter='${k}';renderProducts()"><b>${i}</b>${n}</button>`).join('');$('productList').innerHTML=db.products.filter(p=>(catFilter==='all'||p.cat===catFilter)&&p.name.toLowerCase().includes(q)).sort((a,b)=>b.fav-a.fav||a.name.localeCompare(b.name)).map(p=>`<div class=rowcard><div class=emoji>${p.emoji||icons[p.cat]||'📦'}</div><div class=grow><b>${p.name}</b><div class=meta>${p.cat} • ${p.unit} • domyślnie ${p.qty||'—'}</div></div><button class=star onclick="toggleFav('${p.id}')">${p.fav?'★':'☆'}</button><button class=edit onclick="openProduct('${p.id}')">Edytuj</button></div>`).join('');fillHist()}
function toggleFav(id){prod(id).fav=!prod(id).fav;save();renderProducts()}function openProduct(id){editPid=id||null;fillCats();let p=id?prod(id):null;$('pName').value=p?.name||'';$('pCat').value=p?.cat||db.categories[0];$('pUnit').value=p?.unit||'kg';$('pQty').value=p?.qty||'';$('pVendor').value=p?.vendor||'';$('pFav').checked=!!p?.fav;openM('productModal')}
function saveProduct(){let n=$('pName').value.trim();if(!n)return;let d={name:n,cat:$('pCat').value,unit:$('pUnit').value,qty:$('pQty').value,vendor:$('pVendor').value,fav:$('pFav').checked};if(editPid)Object.assign(prod(editPid),d);else db.products.push({id:'p'+Date.now(),emoji:icons[d.cat]||'📦',...d});save();closeM('productModal');renderAll()}
function fillCats(){$('pCat').innerHTML=db.categories.map(c=>`<option>${c}</option>`).join('');$('settingsCats').innerHTML=db.categories.map(c=>`<span class=chip>${c}</span>`).join('')}function addCat(){let n=$('newCat').value.trim();if(n&&!db.categories.includes(n))db.categories.push(n);$('newCat').value='';save();renderAll()}
function fillHist(){let old=$('histProduct').value;$('histProduct').innerHTML=db.products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');if(old)$('histProduct').value=old}
function renderHistory(){let pid=$('histProduct').value||db.products[0]?.id,p=prod(pid);if(!p)return;let rows=[];Object.entries(db.lists).forEach(([d,l])=>l.forEach(x=>{if(x.pid===pid&&x.state==='bought'&&+x.qty&&+x.total)rows.push({d,r:+x.total/+x.qty,x})}));rows.sort((a,b)=>a.d.localeCompare(b.d));let vals=rows.map(x=>x.r),min=Math.min(...vals,0),max=Math.max(...vals,1),pts=rows.map((x,i)=>`${20+i*(260/Math.max(rows.length-1,1))},${150-(x.r-min)/(Math.max(max-min,1))*110}`).join(' ');$('chart').innerHTML=rows.length?`<svg viewBox="0 0 300 170"><line x1="20" y1="150" x2="285" y2="150" stroke="#ccd5ce"/><polyline points="${pts}" fill="none" stroke="#087a42" stroke-width="3"/><text x="20" y="165" font-size="10">${rows[0].d}</text><text x="225" y="165" font-size="10">${rows.at(-1).d}</text></svg>`:'<div class=empty>Brak danych do wykresu.</div>';let last=rows.at(-1)?.r||0,avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0,lo=vals.length?Math.min(...vals):0,hi=vals.length?Math.max(...vals):0;$('stats').innerHTML=`<div class=stat>Ostatnia<b>${money(last)}/${p.unit}</b></div><div class=stat>Średnia<b>${money(avg)}/${p.unit}</b></div><div class=stat>Najniższa<b>${money(lo)}/${p.unit}</b></div><div class=stat>Najwyższa<b>${money(hi)}/${p.unit}</b></div>`;$('historyRows').innerHTML=rows.slice().reverse().map(r=>`<div class=rowcard><div><b>${r.d}</b><div class=meta>${r.x.qty} ${p.unit}${r.x.vendor?' • '+r.x.vendor:''}</div></div><b>${money(r.r)}/${p.unit}</b></div>`).join('')}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='gielda-backup.json';a.click()}function importData(i){let f=i.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{db=JSON.parse(r.result);save();renderAll();alert('Dane przywrócone.')}catch{alert('Nieprawidłowy plik.')}};r.readAsText(f)}
function openM(id){$(id).classList.add('open')}function closeM(id){$(id).classList.remove('open')}function renderAll(){renderToday();renderLists();renderProducts();fillCats();fillHist();renderHistory();save()}renderAll();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js');
</script></body></html>
